name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Get version
        id: version
        run: echo "VERSION=$(git describe --tags --always)" >> $GITHUB_OUTPUT

      - name: Build ARM64
        run: GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.VERSION }}" -o maxwell-irc-arm64 .

      - name: Build ARM
        run: GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.VERSION }}" -o maxwell-irc-arm .

      - name: Build AMD64
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.VERSION }}" -o maxwell-irc-amd64 .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            maxwell-irc-arm64
            maxwell-irc-arm
            maxwell-irc-amd64
          generate_release_notes: true
