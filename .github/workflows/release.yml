name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Pure-Go build (modernc sqlite): static binaries that run on any glibc/musl.
env:
  CGO_ENABLED: "0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Get version
        id: version
        run: echo "VERSION=$(git describe --tags --always)" >> $GITHUB_OUTPUT

      - name: Build ARM64
        run: GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.VERSION }}" -o xirc-linux-arm64 .

      - name: Build ARMv7
        run: GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.VERSION }}" -o xirc-linux-armv7 .

      - name: Build AMD64
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.VERSION }}" -o xirc-linux-amd64 .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            xirc-linux-arm64
            xirc-linux-armv7
            xirc-linux-amd64
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/xirc:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.name }}/xirc:latest
