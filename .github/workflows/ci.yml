name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build linux/amd64
        run: go build -ldflags="-s -w" -o maxwell-irc-amd64 .

      - name: Check deploy scripts
        run: for f in scripts/*.sh; do bash -n "$f"; done && bash scripts/test-proxy-templates.sh && bash scripts/test-install-lib.sh
