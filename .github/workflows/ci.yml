name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build linux/amd64
        run: go build -ldflags="-s -w" -o maxwell-irc-amd64 .

      - name: Check deploy scripts
        run: bash -n scripts/*.sh && bash scripts/test-proxy-templates.sh
