# Copy to config.yaml and adjust for your environment.
# Generated via: make preconfig

server:
  host: 127.0.0.1
  port: 8085

database:
  driver: sqlite
  path: /opt/maxwell-irc/data/maxwell-irc.db

storage:
  media_dir: /srv/dlna/media
  downloads_dir: /srv/downloads
  temp_dir: /srv/downloads/.tmp
  min_free_space: 1GB
  critical_free_space: 500MB
  auto_extract:
    enabled: false
    delete_archive: false

dcc:
  passive_enabled: false
  passive_ports: "30000-30010"
  external_ip: ""

downloads:
  max_concurrent: 3

notifications:
  quiet_hours_start: ""
  quiet_hours_end: ""

# Background job that prunes stale search_results rows and caps the
# self-collected file index so both stay bounded over time.
maintenance:
  search_result_retention_days: 14
  index_max_files: 200000
  interval_hours: 6
