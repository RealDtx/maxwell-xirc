# Copy to config.yaml and adjust for your environment.
# Generated via: make preconfig

server:
  host: 127.0.0.1
  port: 8085

database:
  driver: sqlite
  path: /opt/xirc/data/xirc.db

storage:
  media_dir: /srv/dlna/media
  downloads_dir: /srv/downloads
  temp_dir: /srv/downloads/.tmp
  min_free_space: 1GB

downloads:
  max_concurrent: 3

# Background job that prunes stale search_results rows and caps the
# self-collected file index so both stay bounded over time.
maintenance:
  search_result_retention_days: 14
  index_max_files: 200000
  interval_hours: 6

# Login. Without trusted_networks every client must log in (the first visit
# creates the admin unless one was created with --create-admin).
auth:
  trusted_networks: []           # e.g. [192.168.0.0/16]: these clients skip login
  trusted_role: admin            # role they get: admin | user
  trusted_proxies: [127.0.0.1/32, "::1/128"]  # peers whose X-Forwarded-* is believed
