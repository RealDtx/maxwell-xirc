server:
  host: 127.0.0.1
  port: 8085

database:
  driver: sqlite
  path: ./data/xirc.db

storage:
  media_dir: /root/media
  downloads_dir: /root/dl
  temp_dir: /srv/downloads/.tmp
  min_free_space: 1GB
  critical_free_space: 500MB

dcc:
  passive_enabled: false
  passive_ports: "30000-30010"
  external_ip: ""

downloads:
  max_concurrent: 3

notifications:
  quiet_hours_start: ""
  quiet_hours_end: ""
