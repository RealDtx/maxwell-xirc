<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xirc</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="appStore">
<div class="app">

    <!-- Mobile hamburger -->
    <button class="hamburger-btn"
            @click="sidebarOpen = !sidebarOpen">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
    </button>
    <!-- Mobile overlay -->
    <div class="sidebar-overlay"
         x-show="sidebarOpen"
         @click="sidebarOpen = false"></div>

    <!-- Sidebar -->
    <aside class="sidebar" :class="sidebarOpen ? 'open' : ''">
        <div class="sidebar-header" @click="setView('home')" style="cursor:pointer;">xirc</div>

        <div class="server-tree" x-show="appMode === 'advanced'">
            <template x-for="server in servers" :key="server.id">
                <div>
                    <!-- Server row -->
                    <div
                        class="server-item"
                        :class="{ active: activeServer === server.id && activeView === 'channel' }"
                        @click="toggleServer(server.id); sidebarOpen = false"
                    >
                        <span
                            class="status-dot"
                            :class="serverStatus(server.id)"
                        ></span>
                        <span x-text="server.name"></span>
                    </div>

                    <!-- Channels under this server -->
                    <template x-if="isExpanded(server.id)">
                        <div>
                            <template x-for="ch in (server.channels || [])" :key="ch">
                                <div
                                    class="channel-item"
                                    :class="{ active: activeServer === server.id && activeChannel === ch && activeView === 'channel' }"
                                    @click="selectChannel(server.id, ch); sidebarOpen = false"
                                    x-text="ch"
                                ></div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- Bottom nav -->
        <nav class="sidebar-nav">
            <a
                :class="{ active: activeView === 'channel' }"
                @click="activeView = 'channel'; sidebarOpen = false"
            >Channels</a>
            <a
                :class="{ active: activeView === 'downloads' }"
                @click="setView('downloads'); sidebarOpen = false"
            >Downloads</a>
            <a
                x-show="appMode === 'advanced'"
                :class="{ active: activeView === 'settings' }"
                @click="setView('settings'); sidebarOpen = false"
            >Settings</a>
        </nav>

        <!-- Disk usage bar (placeholder) -->
        <div>
            <div class="disk-label">Disk</div>
            <div class="disk-bar">
                <div class="disk-bar-fill ok" style="width: 0%"></div>
            </div>
        </div>

        <!-- Mode toggle -->
        <div class="sidebar-mode-toggle">
            <span>Mode:</span>
            <div class="mode-btns">
                <button @click="setMode('simple')"
                        :class="appMode === 'simple' ? 'active' : ''">Simple</button>
                <button @click="setMode('advanced')"
                        :class="appMode === 'advanced' ? 'active' : ''">Advanced</button>
            </div>
        </div>
    </aside>

    <!-- Main content -->
    <main class="main">

        <!-- Channel view -->
        <template x-if="activeView === 'channel'">
            <div style="display:flex; flex-direction:column; height:100%; overflow:hidden;">

                <!-- Header row -->
                <div class="content-header">
                    <span x-text="activeChannel || 'Select a channel'"></span>

                    <!-- Tab row: single-pane mode only, only when channel selected -->
                    <template x-if="activeChannel && channelLayout(channelKey(activeServer, activeChannel)) === 'single'">
                        <div class="tabs channel-tabs" style="border-bottom:none; margin-left:8px;">
                            <div
                                class="tab"
                                :class="{ active: activeTab(channelKey(activeServer, activeChannel)) === 'search' }"
                                @click="setActiveTab(channelKey(activeServer, activeChannel), 'search')"
                            >Search</div>
                            <template x-if="currentChannelHasDownloadChannel()">
                                <div
                                    class="tab"
                                    :class="{ active: activeTab(channelKey(activeServer, activeChannel)) === 'download' }"
                                    @click="setActiveTab(channelKey(activeServer, activeChannel), 'download')"
                                >Downloads IRC</div>
                            </template>
                        </div>
                    </template>

                    <!-- Layout toggle: advanced mode, desktop only -->
                    <template x-if="activeChannel && appMode === 'advanced'">
                        <div class="channel-layout-btns" style="margin-left:auto; display:flex; gap:4px;">
                            <button
                                class="btn btn-sm"
                                :class="channelLayout(channelKey(activeServer, activeChannel)) === 'single' ? 'btn-primary' : ''"
                                @click="setChannelLayout(channelKey(activeServer, activeChannel), 'single')"
                                title="Single pane"
                            >⬜</button>
                            <button
                                class="btn btn-sm"
                                :class="channelLayout(channelKey(activeServer, activeChannel)) === 'sidebyside' ? 'btn-primary' : ''"
                                @click="setChannelLayout(channelKey(activeServer, activeChannel), 'sidebyside')"
                                title="Side by side"
                            >⬛⬛</button>
                        </div>
                    </template>
                </div>

                <!-- No channel selected -->
                <template x-if="!activeChannel">
                    <div class="content-body">
                        <p style="color: var(--text-muted); font-size:13px;">Select a channel from the sidebar to begin.</p>
                    </div>
                </template>

                <!-- Channel selected: single-pane layout -->
                <template x-if="activeChannel && channelLayout(channelKey(activeServer, activeChannel)) === 'single'">
                    <div style="flex:1; overflow:hidden; display:flex; flex-direction:column;">

                        <!-- Search pane (single-pane, search tab) -->
                        <div
                            class="content-body channel-pane"
                            x-show="activeTab(channelKey(activeServer, activeChannel)) === 'search'"
                            style="overflow:hidden; flex:1; display:flex; flex-direction:column;"
                        >
                            <div style="padding:16px; overflow-y:auto; flex-shrink:0;">
                                <div class="search-bar">
                                    <input
                                        type="text"
                                        placeholder="Search for files..."
                                        x-model="searchQuery"
                                        @keydown.enter="runSearch()"
                                    >
                                    <button
                                        class="btn btn-primary"
                                        @click="runSearch()"
                                        :disabled="searchRunning"
                                        x-text="searchRunning ? 'Searching...' : 'Search'"
                                    ></button>
                                    <button
                                        class="btn btn-sm"
                                        @click="bookmarkSearch()"
                                        :disabled="!searchQuery.trim()"
                                        title="Save this search"
                                    >Bookmark</button>
                                    <select
                                        style="padding:6px 8px; background:var(--bg-input); border:1px solid var(--border); border-radius:4px; color:var(--text-primary); font-size:13px;"
                                        @change="applySavedSearch($event.target.value); $event.target.value = ''"
                                    >
                                        <option value="">Saved searches…</option>
                                        <template x-for="ss in savedSearches" :key="ss.id">
                                            <option :value="ss.query" x-text="ss.query"></option>
                                        </template>
                                    </select>
                                </div>

                                <template x-if="searchResults.length > 0">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th @click="sortBy('pack_number')" x-text="'Pack #' + sortIndicator('pack_number')"></th>
                                                <th @click="sortBy('filename')" x-text="'Filename' + sortIndicator('filename')"></th>
                                                <th @click="sortBy('filesize')" x-text="'Size' + sortIndicator('filesize')"></th>
                                                <th @click="sortBy('bot_nick')" x-text="'Bot' + sortIndicator('bot_nick')"></th>
                                                <th @click="sortBy('downloads_count')" x-text="'Downloads' + sortIndicator('downloads_count')"></th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template x-for="(r, i) in sortedResults()" :key="i">
                                                <tr :class="{ unparsed: !r.parsed }">
                                                    <td x-text="r.pack_number != null ? r.pack_number : '-'"></td>
                                                    <td>
                                                        <span x-text="r.filename || r.raw_line || '-'"></span>
                                                        <template x-if="!r.parsed">
                                                            <a
                                                                href="#"
                                                                style="margin-left:8px; font-size:11px; color:var(--warning);"
                                                                @click.prevent="teachParser(r.raw_line)"
                                                            >teach parser</a>
                                                        </template>
                                                    </td>
                                                    <td x-text="r.filesize || '-'"></td>
                                                    <td x-text="r.bot_nick || '-'"></td>
                                                    <td x-text="r.downloads_count != null ? r.downloads_count : '-'"></td>
                                                    <td>
                                                        <button
                                                            class="btn btn-primary btn-sm"
                                                            @click="downloadPack(r)"
                                                            :disabled="!r.parsed"
                                                        >Download</button>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </template>

                                <template x-if="searchResults.length === 0 && !searchRunning">
                                    <p style="color: var(--text-muted); font-size:13px;">No results. Enter a query and press Search.</p>
                                </template>
                            </div>

                            <!-- IRC log embedded at bottom of search pane -->
                            <div style="display:flex;flex:1;overflow:hidden;">
                                <div style="flex:1;overflow-y:auto;" class="irc-messages irc-log-pane" x-ref="ircLog">
                                    <template x-for="(msg, i) in currentChannelMessages()" :key="i">
                                        <div class="irc-message" :class="selectedUser && msg.nick === selectedUser ? 'msg-highlight' : ''">
                                            <span class="time" x-text="formatTime(msg.timestamp)"></span>
                                            <span class="nick" x-text="msg.nick + ':'"></span>
                                            <span x-text="msg.message"></span>
                                        </div>
                                    </template>
                                </div>
                                <div class="user-list-sidebar" x-show="appMode === 'advanced'">
                                    <div class="user-list-header">
                                        <span>Users</span>
                                        <button @click="loadUserList(activeServer, activeChannel)" title="Refresh">↺</button>
                                    </div>
                                    <div class="user-list-body">
                                        <template x-if="userListLoading[channelKey(activeServer, activeChannel)]">
                                            <div class="text-muted p-2">Loading...</div>
                                        </template>
                                        <template x-for="nick in userLists[channelKey(activeServer, activeChannel)] || []" :key="nick">
                                            <div @click="selectUser(nick.replace(/^[@+%]/, ''))"
                                                 :class="isUserSelected(nick.replace(/^[@+%]/, '')) ? 'user-selected' : ''"
                                                 class="user-list-item" x-text="nick"></div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                            <div class="irc-input">
                                <input
                                    type="text"
                                    placeholder="Type a message or /command..."
                                    x-model="ircInput"
                                    @keydown.enter="sendIrc()"
                                >
                            </div>
                        </div>

                        <!-- Download channel IRC pane (single-pane, download tab) -->
                        <div
                            class="irc-console channel-pane"
                            x-show="activeTab(channelKey(activeServer, activeChannel)) === 'download' && currentChannelHasDownloadChannel()"
                        >
                            <div style="display:flex;flex:1;overflow:hidden;">
                                <div style="flex:1;overflow-y:auto;" class="irc-messages irc-log-pane" x-ref="ircLogDownload">
                                    <template x-for="(msg, i) in (ircMessages[channelKey(activeServer, downloadChannelForCurrent())] || [])" :key="i">
                                        <div class="irc-message" :class="selectedUser && msg.nick === selectedUser ? 'msg-highlight' : ''">
                                            <span class="time" x-text="formatTime(msg.timestamp)"></span>
                                            <span class="nick" x-text="msg.nick + ':'"></span>
                                            <span x-text="msg.message"></span>
                                        </div>
                                    </template>
                                </div>
                                <div class="user-list-sidebar" x-show="appMode === 'advanced'">
                                    <div class="user-list-header">
                                        <span>Users</span>
                                        <button @click="loadUserList(activeServer, downloadChannelForCurrent())" title="Refresh">↺</button>
                                    </div>
                                    <div class="user-list-body">
                                        <template x-if="userListLoading[channelKey(activeServer, downloadChannelForCurrent())]">
                                            <div class="text-muted p-2">Loading...</div>
                                        </template>
                                        <template x-for="nick in userLists[channelKey(activeServer, downloadChannelForCurrent())] || []" :key="nick">
                                            <div @click="selectUser(nick.replace(/^[@+%]/, ''))"
                                                 :class="isUserSelected(nick.replace(/^[@+%]/, '')) ? 'user-selected' : ''"
                                                 class="user-list-item" x-text="nick"></div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                            <div class="irc-input">
                                <input
                                    type="text"
                                    placeholder="Type a message..."
                                    x-model="ircInput"
                                    @keydown.enter="sendIrcToChannel(activeServer, downloadChannelForCurrent())"
                                >
                            </div>
                        </div>


                    </div>
                </template>

                <!-- Channel selected: side-by-side layout (advanced mode) -->
                <template x-if="activeChannel && channelLayout(channelKey(activeServer, activeChannel)) === 'sidebyside'">
                    <div style="flex:1; overflow:hidden; display:flex; flex-direction:row; gap:0;">

                        <!-- Search pane (left) -->
                        <div class="channel-pane-side" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; border-right:1px solid var(--border);">
                            <div class="channel-pane-side-header">Search</div>
                            <div style="padding:16px; flex:1; overflow-y:auto;">
                                <div class="search-bar">
                                    <input
                                        type="text"
                                        placeholder="Search for files..."
                                        x-model="searchQuery"
                                        @keydown.enter="runSearch()"
                                    >
                                    <button
                                        class="btn btn-primary"
                                        @click="runSearch()"
                                        :disabled="searchRunning"
                                        x-text="searchRunning ? 'Searching...' : 'Search'"
                                    ></button>
                                    <button
                                        class="btn btn-sm"
                                        @click="bookmarkSearch()"
                                        :disabled="!searchQuery.trim()"
                                        title="Save this search"
                                    >Bookmark</button>
                                    <select
                                        style="padding:6px 8px; background:var(--bg-input); border:1px solid var(--border); border-radius:4px; color:var(--text-primary); font-size:13px;"
                                        @change="applySavedSearch($event.target.value); $event.target.value = ''"
                                    >
                                        <option value="">Saved searches…</option>
                                        <template x-for="ss in savedSearches" :key="ss.id">
                                            <option :value="ss.query" x-text="ss.query"></option>
                                        </template>
                                    </select>
                                </div>

                                <template x-if="searchResults.length > 0">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th @click="sortBy('pack_number')" x-text="'Pack #' + sortIndicator('pack_number')"></th>
                                                <th @click="sortBy('filename')" x-text="'Filename' + sortIndicator('filename')"></th>
                                                <th @click="sortBy('filesize')" x-text="'Size' + sortIndicator('filesize')"></th>
                                                <th @click="sortBy('bot_nick')" x-text="'Bot' + sortIndicator('bot_nick')"></th>
                                                <th @click="sortBy('downloads_count')" x-text="'Downloads' + sortIndicator('downloads_count')"></th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template x-for="(r, i) in sortedResults()" :key="i">
                                                <tr :class="{ unparsed: !r.parsed }">
                                                    <td x-text="r.pack_number != null ? r.pack_number : '-'"></td>
                                                    <td>
                                                        <span x-text="r.filename || r.raw_line || '-'"></span>
                                                        <template x-if="!r.parsed">
                                                            <a
                                                                href="#"
                                                                style="margin-left:8px; font-size:11px; color:var(--warning);"
                                                                @click.prevent="teachParser(r.raw_line)"
                                                            >teach parser</a>
                                                        </template>
                                                    </td>
                                                    <td x-text="r.filesize || '-'"></td>
                                                    <td x-text="r.bot_nick || '-'"></td>
                                                    <td x-text="r.downloads_count != null ? r.downloads_count : '-'"></td>
                                                    <td>
                                                        <button
                                                            class="btn btn-primary btn-sm"
                                                            @click="downloadPack(r)"
                                                            :disabled="!r.parsed"
                                                        >Download</button>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </template>

                                <template x-if="searchResults.length === 0 && !searchRunning">
                                    <p style="color: var(--text-muted); font-size:13px;">No results. Enter a query and press Search.</p>
                                </template>
                            </div>
                        </div>

                        <!-- Download channel IRC pane (right) -->
                        <div class="channel-pane-side irc-console" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
                            <div class="channel-pane-side-header" x-text="currentChannelHasDownloadChannel() ? downloadChannelForCurrent() : activeChannel"></div>
                            <div style="display:flex;flex:1;overflow:hidden;">
                                <div style="flex:1;overflow-y:auto;" class="irc-messages irc-log-pane">
                                    <template x-if="currentChannelHasDownloadChannel()">
                                        <div>
                                            <template x-for="(msg, i) in (ircMessages[channelKey(activeServer, downloadChannelForCurrent())] || [])" :key="i">
                                                <div class="irc-message" :class="selectedUser && msg.nick === selectedUser ? 'msg-highlight' : ''">
                                                    <span class="time" x-text="formatTime(msg.timestamp)"></span>
                                                    <span class="nick" x-text="msg.nick + ':'"></span>
                                                    <span x-text="msg.message"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template x-if="!currentChannelHasDownloadChannel()">
                                        <div>
                                            <template x-for="(msg, i) in currentChannelMessages()" :key="i">
                                                <div class="irc-message" :class="selectedUser && msg.nick === selectedUser ? 'msg-highlight' : ''">
                                                    <span class="time" x-text="formatTime(msg.timestamp)"></span>
                                                    <span class="nick" x-text="msg.nick + ':'"></span>
                                                    <span x-text="msg.message"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                                <div class="user-list-sidebar" x-show="appMode === 'advanced'">
                                    <div class="user-list-header">
                                        <span>Users</span>
                                        <button @click="loadUserList(activeServer, currentChannelHasDownloadChannel() ? downloadChannelForCurrent() : activeChannel)" title="Refresh">↺</button>
                                    </div>
                                    <div class="user-list-body">
                                        <template x-if="userListLoading[channelKey(activeServer, currentChannelHasDownloadChannel() ? downloadChannelForCurrent() : activeChannel)]">
                                            <div class="text-muted p-2">Loading...</div>
                                        </template>
                                        <template x-for="nick in userLists[channelKey(activeServer, currentChannelHasDownloadChannel() ? downloadChannelForCurrent() : activeChannel)] || []" :key="nick">
                                            <div @click="selectUser(nick.replace(/^[@+%]/, ''))"
                                                 :class="isUserSelected(nick.replace(/^[@+%]/, '')) ? 'user-selected' : ''"
                                                 class="user-list-item" x-text="nick"></div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                            <div class="irc-input">
                                <input
                                    type="text"
                                    placeholder="Type a message or /command..."
                                    x-model="ircInput"
                                    @keydown.enter="sendIrcToChannel(activeServer, currentChannelHasDownloadChannel() ? downloadChannelForCurrent() : activeChannel)"
                                >
                            </div>
                        </div>

                    </div>
                </template>

            </div>
        </template>

        <!-- Downloads view -->
        <template x-if="activeView === 'downloads'">
            <div style="display:flex; flex-direction:column; height:100%; overflow:hidden;">
                <div class="content-header">
                    <span>Downloads</span>
                    <button class="btn btn-sm" style="margin-left:auto" @click="loadDownloads()">Refresh</button>
                </div>
                <div class="content-body" style="display:flex; flex-direction:column; gap:0; overflow:hidden;">
                    <!-- Filter tabs -->
                    <div class="tabs">
                        <div class="tab" :class="{ active: downloadFilter === 'all' }" @click="downloadFilter = 'all'">All</div>
                        <div class="tab" :class="{ active: downloadFilter === 'queued' }" @click="downloadFilter = 'queued'">Queued</div>
                        <div class="tab" :class="{ active: downloadFilter === 'downloading' }" @click="downloadFilter = 'downloading'">Downloading</div>
                        <div class="tab" :class="{ active: downloadFilter === 'completed' }" @click="downloadFilter = 'completed'">Completed</div>
                        <div class="tab" :class="{ active: downloadFilter === 'failed' }" @click="downloadFilter = 'failed'">Failed</div>
                    </div>
                    <!-- Downloads table -->
                    <div style="overflow-y:auto; flex:1;">
                        <template x-if="filteredDownloads().length > 0">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Status</th>
                                        <th>Filename</th>
                                        <th>Bot</th>
                                        <th>Size</th>
                                        <th>Progress</th>
                                        <th>Speed</th>
                                        <th>ETA</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="dl in filteredDownloads()" :key="dl.id">
                                        <tr>
                                            <td>
                                                <span
                                                    class="badge"
                                                    :class="'badge-' + dl.status"
                                                    x-text="dl.status"
                                                ></span>
                                            </td>
                                            <td x-text="dl.filename || '-'"></td>
                                            <td>
                                                <span class="tooltip">
                                                    <span x-text="dl.bot_nick || '-'"></span>
                                                    <span class="tooltip-text" x-text="dl.filesize || '-'"></span>
                                                </span>
                                            </td>
                                            <td x-text="dl.filesize || '-'"></td>
                                            <td>
                                                <template x-if="dl.status === 'downloading'">
                                                    <div class="progress">
                                                        <div
                                                            class="progress-fill"
                                                            :style="'width:' + downloadProgress(dl) + '%'"
                                                        ></div>
                                                    </div>
                                                </template>
                                                <template x-if="dl.status !== 'downloading'">
                                                    <span x-text="dl.status === 'completed' ? '100%' : '-'"></span>
                                                </template>
                                            </td>
                                            <td x-text="dl.status === 'downloading' && dl.speed ? formatSpeed(dl.speed) : '-'"></td>
                                            <td x-text="dl.status==='downloading' ? formatETA(Math.max(0, dl.total_size - dl.bytes_received), dl.speed) : '-'"></td>
                                            <td style="white-space:nowrap;">
                                                <template x-if="dl.status === 'downloading' || dl.status === 'queued'">
                                                    <span>
                                                        <button class="btn btn-danger btn-sm" @click="cancelDownload(dl.id)">Cancel</button>
                                                        <template x-if="dl.status === 'queued'">
                                                            <button class="btn btn-sm" style="margin-left:4px" @click="moveToFront(dl.id)">Move to front</button>
                                                        </template>
                                                    </span>
                                                </template>
                                                <template x-if="dl.status === 'failed' || dl.status === 'needs_action'">
                                                    <button class="btn btn-primary btn-sm" @click="retryDownload(dl.id)">Retry</button>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template x-if="filteredDownloads().length === 0">
                            <p style="color: var(--text-muted); font-size:13px; padding:16px 0;">No downloads.</p>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- Settings view -->
        <template x-if="activeView === 'settings'">
            <div style="display:flex; flex-direction:column; height:100%; overflow:hidden;">
                <div class="content-header">
                    <span>Settings</span>
                </div>
                <div class="content-body" style="overflow-y:auto; flex:1;">

                    <!-- Settings tab bar -->
                    <div class="tabs">
                        <div class="tab" :class="{ active: settingsTab === 'servers' }" @click="settingsTab = 'servers'">Servers</div>
                        <div class="tab" :class="{ active: settingsTab === 'channels' }" @click="settingsTab = 'channels'">Channels</div>
                        <div class="tab" :class="{ active: settingsTab === 'routing' }" @click="settingsTab = 'routing'">File Routing</div>
                        <div class="tab" :class="{ active: settingsTab === 'hooks' }" @click="settingsTab = 'hooks'">Post-Hooks</div>
                        <div class="tab" :class="{ active: settingsTab === 'general' }" @click="settingsTab = 'general'">General</div>
                    </div>

                    <!-- Servers tab -->
                    <template x-if="settingsTab === 'servers'">
                        <div style="padding-top:16px;">
                            <button class="btn btn-primary btn-sm" @click="openServerForm(null)">Add Server</button>

                            <template x-if="settingsServers.length > 0">
                                <table style="margin-top:12px;">
                                    <thead>
                                        <tr>
                                            <th>Name</th>
                                            <th>Host</th>
                                            <th>Port</th>
                                            <th>Nick</th>
                                            <th>TLS</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="s in settingsServers" :key="s.id">
                                            <tr>
                                                <td x-text="s.name"></td>
                                                <td x-text="s.host"></td>
                                                <td x-text="s.port"></td>
                                                <td x-text="s.nickname"></td>
                                                <td x-text="s.ssl ? 'Yes' : 'No'"></td>
                                                <td style="white-space:nowrap;">
                                                    <button class="btn btn-sm" @click="openServerForm(s)">Edit</button>
                                                    <button class="btn btn-danger btn-sm" style="margin-left:4px;" @click="deleteServer(s.id)">Delete</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>
                            <template x-if="settingsServers.length === 0">
                                <p style="color:var(--text-muted); font-size:13px; margin-top:12px;">No servers configured.</p>
                            </template>

                            <!-- Server inline form -->
                            <template x-if="showServerForm">
                                <div style="margin-top:20px; padding:16px; border:1px solid var(--border); border-radius:6px;">
                                    <h3 style="margin:0 0 16px;" x-text="serverForm.id ? 'Edit Server' : 'Add Server'"></h3>
                                    <div class="form-group">
                                        <label>Name</label>
                                        <input type="text" x-model="serverForm.name" placeholder="e.g. IRCNet">
                                    </div>
                                    <div class="form-group">
                                        <label>Host</label>
                                        <input type="text" x-model="serverForm.host" placeholder="irc.example.net">
                                    </div>
                                    <div class="form-group">
                                        <label>Port</label>
                                        <input type="number" x-model.number="serverForm.port" min="1" max="65535">
                                    </div>
                                    <div class="form-group">
                                        <label>Nick</label>
                                        <input type="text" x-model="serverForm.nickname" placeholder="mynick">
                                    </div>
                                    <div class="form-group">
                                        <label>SSL</label>
                                        <label class="toggle">
                                            <input type="checkbox" x-model="serverForm.ssl">
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                    <div class="form-group">
                                        <label>Auto Connect</label>
                                        <label class="toggle">
                                            <input type="checkbox" x-model="serverForm.auto_connect">
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                    <div style="margin-top:12px; display:flex; gap:8px;">
                                        <button class="btn btn-primary btn-sm" @click="saveServer()">Save</button>
                                        <button class="btn btn-sm" @click="showServerForm = false">Cancel</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Channels tab -->
                    <template x-if="settingsTab === 'channels'">
                        <div style="padding-top:16px;">
                            <div class="form-group" style="max-width:320px;">
                                <label>Server</label>
                                <select @change="loadSettingsChannels(parseInt($event.target.value))" style="padding:6px 8px; background:var(--bg-input); border:1px solid var(--border); border-radius:4px; color:var(--text-primary); font-size:13px; width:100%;">
                                    <option value="">Select a server…</option>
                                    <template x-for="s in settingsServers" :key="s.id">
                                        <option :value="s.id" :selected="settingsServerId === s.id" x-text="s.name"></option>
                                    </template>
                                </select>
                            </div>

                            <button class="btn btn-primary btn-sm" :disabled="!settingsServerId" @click="openChannelForm(null)">Add Channel</button>

                            <template x-if="settingsServerId && settingsChannels.length > 0">
                                <table style="margin-top:12px;">
                                    <thead>
                                        <tr>
                                            <th>Name</th>
                                            <th>Search Command</th>
                                            <th>Download Channel</th>
                                            <th>Auto-join</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="ch in settingsChannels" :key="ch.id">
                                            <tr>
                                                <td x-text="ch.name"></td>
                                                <td x-text="ch.search_command || '-'"></td>
                                                <td x-text="ch.download_channel || '-'"></td>
                                                <td x-text="ch.auto_join ? 'Yes' : 'No'"></td>
                                                <td style="white-space:nowrap;">
                                                    <button class="btn btn-sm" @click="openChannelForm(ch)">Edit</button>
                                                    <button class="btn btn-danger btn-sm" style="margin-left:4px;" @click="deleteChannel(ch.id)">Delete</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>
                            <template x-if="settingsServerId && settingsChannels.length === 0">
                                <p style="color:var(--text-muted); font-size:13px; margin-top:12px;">No channels configured for this server.</p>
                            </template>

                            <!-- Channel inline form -->
                            <template x-if="showChannelForm">
                                <div style="margin-top:20px; padding:16px; border:1px solid var(--border); border-radius:6px;">
                                    <h3 style="margin:0 0 16px;" x-text="channelForm.id ? 'Edit Channel' : 'Add Channel'"></h3>
                                    <div class="form-group">
                                        <label>Name</label>
                                        <input type="text" x-model="channelForm.name" placeholder="#channel">
                                    </div>
                                    <div class="form-group">
                                        <label>Search Command</label>
                                        <input type="text" x-model="channelForm.search_command" placeholder="!search">
                                    </div>
                                    <div class="form-group">
                                        <label>Download Channel</label>
                                        <input type="text" x-model="channelForm.download_channel" placeholder="#download-channel">
                                    </div>
                                    <div class="form-group">
                                        <label>Auto-join</label>
                                        <label class="toggle">
                                            <input type="checkbox" x-model="channelForm.auto_join">
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                    <div style="margin-top:12px; display:flex; gap:8px;">
                                        <button class="btn btn-primary btn-sm" @click="saveChannel()">Save</button>
                                        <button class="btn btn-sm" @click="showChannelForm = false">Cancel</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- File Routing tab -->
                    <template x-if="settingsTab === 'routing'">
                        <div style="padding-top:16px;">
                            <button class="btn btn-primary btn-sm" @click="openRoutingForm(null)">Add Rule</button>

                            <template x-if="routingRules.length > 0">
                                <table style="margin-top:12px;">
                                    <thead>
                                        <tr>
                                            <th>Pattern</th>
                                            <th>Destination</th>
                                            <th>Priority</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="r in routingRules" :key="r.id">
                                            <tr>
                                                <td x-text="r.pattern"></td>
                                                <td x-text="r.destination_dir"></td>
                                                <td x-text="r.priority"></td>
                                                <td style="white-space:nowrap;">
                                                    <button class="btn btn-sm" @click="openRoutingForm(r)">Edit</button>
                                                    <button class="btn btn-danger btn-sm" style="margin-left:4px;" @click="deleteRoutingRule(r.id)">Delete</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>
                            <template x-if="routingRules.length === 0">
                                <p style="color:var(--text-muted); font-size:13px; margin-top:12px;">No routing rules configured.</p>
                            </template>

                            <!-- Routing inline form -->
                            <template x-if="showRoutingForm">
                                <div style="margin-top:20px; padding:16px; border:1px solid var(--border); border-radius:6px;">
                                    <h3 style="margin:0 0 16px;" x-text="routingForm.id ? 'Edit Rule' : 'Add Rule'"></h3>
                                    <div class="form-group">
                                        <label>Pattern</label>
                                        <input type="text" x-model="routingForm.pattern" placeholder="*.mkv">
                                    </div>
                                    <div class="form-group">
                                        <label>Destination Dir</label>
                                        <input type="text" x-model="routingForm.destination_dir" placeholder="/mnt/media/video">
                                    </div>
                                    <div class="form-group">
                                        <label>Priority</label>
                                        <input type="number" x-model.number="routingForm.priority">
                                    </div>
                                    <div style="margin-top:12px; display:flex; gap:8px;">
                                        <button class="btn btn-primary btn-sm" @click="saveRoutingRule()">Save</button>
                                        <button class="btn btn-sm" @click="showRoutingForm = false">Cancel</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Post-Hooks tab -->
                    <template x-if="settingsTab === 'hooks'">
                        <div style="padding-top:16px;">
                            <button class="btn btn-primary btn-sm" @click="openHookForm(null)">Add Hook</button>

                            <template x-if="hooks.length > 0">
                                <table style="margin-top:12px;">
                                    <thead>
                                        <tr>
                                            <th>Name</th>
                                            <th>Type</th>
                                            <th>Config</th>
                                            <th>Enabled</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="h in hooks" :key="h.id">
                                            <tr>
                                                <td x-text="h.name"></td>
                                                <td x-text="h.hook_type"></td>
                                                <td x-text="h.config"></td>
                                                <td x-text="h.enabled ? 'Yes' : 'No'"></td>
                                                <td style="white-space:nowrap;">
                                                    <button class="btn btn-sm" @click="openHookForm(h)">Edit</button>
                                                    <button class="btn btn-danger btn-sm" style="margin-left:4px;" @click="deleteHook(h.id)">Delete</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>
                            <template x-if="hooks.length === 0">
                                <p style="color:var(--text-muted); font-size:13px; margin-top:12px;">No hooks configured.</p>
                            </template>

                            <!-- Hook inline form -->
                            <template x-if="showHookForm">
                                <div style="margin-top:20px; padding:16px; border:1px solid var(--border); border-radius:6px;">
                                    <h3 style="margin:0 0 16px;" x-text="hookForm.id ? 'Edit Hook' : 'Add Hook'"></h3>
                                    <div class="form-group">
                                        <label>Name</label>
                                        <input type="text" x-model="hookForm.name" placeholder="My Hook">
                                    </div>
                                    <div class="form-group">
                                        <label>Type</label>
                                        <select x-model="hookForm.hook_type" style="padding:6px 8px; background:var(--bg-input); border:1px solid var(--border); border-radius:4px; color:var(--text-primary); font-size:13px;">
                                            <option value="script">Script</option>
                                            <option value="rename">Rename</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Config</label>
                                        <input type="text" x-model="hookForm.config" placeholder="JSON config or rename pattern">
                                    </div>
                                    <div class="form-group">
                                        <label>Enabled</label>
                                        <label class="toggle">
                                            <input type="checkbox" x-model="hookForm.enabled">
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                    <div style="margin-top:12px; display:flex; gap:8px;">
                                        <button class="btn btn-primary btn-sm" @click="saveHook()">Save</button>
                                        <button class="btn btn-sm" @click="showHookForm = false">Cancel</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- General tab -->
                    <template x-if="settingsTab === 'general'">
                        <div style="padding-top:16px;">
                            <p style="color:var(--text-muted); font-size:13px;">General settings coming soon.</p>
                        </div>
                    </template>

                </div>
            </div>
        </template>


        <!-- Home / Dashboard view -->
        <template x-if="activeView === 'home'">
            <div style="display:flex; flex-direction:column; height:100%; overflow:hidden;">
                <div class="content-header">
                    <span>Overview</span>
                </div>
                <div class="content-body" style="overflow-y:auto; flex:1;">

                    <!-- Server status cards -->
                    <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:12px; margin-bottom:24px;">
                        <template x-for="srv in servers" :key="srv.id">
                            <div style="background:var(--bg-secondary); border-radius:6px; padding:16px; cursor:pointer;"
                                 @click="selectServer(srv)">
                                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                                    <span style="font-weight:500;" x-text="srv.name"></span>
                                    <span class="badge"
                                          :class="'badge-' + serverStatus(srv.id)"
                                          x-text="serverStatus(srv.id)"></span>
                                </div>
                                <div style="font-size:12px; color:var(--text-muted); display:flex; flex-direction:column; gap:4px;">
                                    <template x-if="ircStatus[srv.id] && ircStatus[srv.id].connected_at">
                                        <div x-text="'Connected since: ' + formatTime(ircStatus[srv.id].connected_at)"></div>
                                    </template>
                                    <div x-text="'Reconnects: ' + (ircStatus[srv.id] ? ircStatus[srv.id].reconnect_count || 0 : 0)"></div>
                                    <template x-if="ircStatus[srv.id] && ircStatus[srv.id].lag_ms">
                                        <div x-text="'Lag: ' + ircStatus[srv.id].lag_ms + 'ms'"></div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Error overview -->
                    <div style="background:var(--bg-secondary); border-radius:6px; padding:16px;">
                        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
                            <span style="font-weight:500;">
                                Recent Errors
                                <span x-show="unreadErrors > 0"
                                      style="margin-left:8px; background:var(--danger); color:#fff; font-size:11px; border-radius:9999px; padding:1px 6px;"
                                      x-text="unreadErrors"></span>
                            </span>
                            <button @click="clearErrors()" class="btn btn-sm">Clear all</button>
                        </div>
                        <div x-show="errors.length === 0" style="color:var(--text-muted); font-size:13px;">No recent errors.</div>
                        <div style="display:flex; flex-direction:column; gap:8px; max-height:256px; overflow-y:auto;">
                            <template x-for="(err, idx) in errors.slice(0,20)" :key="idx">
                                <div style="display:flex; align-items:flex-start; gap:8px; font-size:13px; background:var(--bg-input); border-radius:4px; padding:8px;">
                                    <span style="color:var(--danger); flex-shrink:0;">&#9888;</span>
                                    <div style="flex:1; min-width:0;">
                                        <div style="color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" x-text="err.message"></div>
                                        <div style="font-size:11px; color:var(--text-muted);" x-text="err.timestamp"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                </div>
            </div>
        </template>

        <!-- Server view -->
        <template x-if="activeView === 'server'">
            <div style="display:flex; flex-direction:column; height:100%; overflow:hidden;">
                <div class="content-header" style="display:flex; align-items:center; gap:12px;">
                    <h2 style="margin:0; font-size:1.1rem; font-weight:600;" x-text="activeServerObj && activeServerObj.name"></h2>
                    <span style="font-size:11px; padding:2px 8px; border-radius:9999px;"
                          :style="{
                              background: serverStatus(activeServer) === 'connected' ? 'var(--success-bg, #14532d)' : serverStatus(activeServer) === 'connecting' ? 'var(--warning-bg, #713f12)' : 'var(--danger-bg, #7f1d1d)',
                              color: serverStatus(activeServer) === 'connected' ? 'var(--success-text, #bbf7d0)' : serverStatus(activeServer) === 'connecting' ? 'var(--warning-text, #fef08a)' : 'var(--danger-text, #fecaca)'
                          }"
                          x-text="serverStatus(activeServer)"></span>
                </div>

                <!-- Stats card -->
                <div style="padding:12px 16px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; border-bottom:1px solid var(--border); font-size:13px;">
                    <div style="background:var(--bg-secondary); border-radius:6px; padding:10px;">
                        <div style="color:var(--text-muted); font-size:11px; margin-bottom:4px;">Connected since</div>
                        <div x-text="ircStatus[activeServer] && ircStatus[activeServer].connected_at ? formatDate(ircStatus[activeServer].connected_at) : '—'"></div>
                    </div>
                    <div style="background:var(--bg-secondary); border-radius:6px; padding:10px;">
                        <div style="color:var(--text-muted); font-size:11px; margin-bottom:4px;">Reconnects</div>
                        <div x-text="ircStatus[activeServer] ? ircStatus[activeServer].reconnect_count || 0 : 0"></div>
                    </div>
                    <div style="background:var(--bg-secondary); border-radius:6px; padding:10px;">
                        <div style="color:var(--text-muted); font-size:11px; margin-bottom:4px;">Lag</div>
                        <div x-text="ircStatus[activeServer] && ircStatus[activeServer].lag_ms ? ircStatus[activeServer].lag_ms + ' ms' : '—'"></div>
                    </div>
                </div>

                <!-- Raw IRC log -->
                <div style="flex:1; overflow-y:auto; font-family:monospace; font-size:12px; padding:10px; display:flex; flex-direction:column; gap:2px;"
                     x-ref="serverLog"
                     @scroll="$el.scrollTop <= 20 && activeServerObj && loadMoreServerMessages(activeServerObj.id)">
                    <template x-for="(msg, idx) in serverMessages[activeServer] || []" :key="idx">
                        <div style="display:flex; gap:8px;">
                            <span style="color:var(--text-muted); flex-shrink:0;" x-text="formatTime(msg.timestamp)"></span>
                            <span style="color:var(--accent, #60a5fa); flex-shrink:0;" x-text="msg.nick ? '&lt;' + msg.nick + '&gt;' : '*'"></span>
                            <span style="color:var(--text-primary); word-break:break-all;" x-text="msg.text || msg.message"></span>
                        </div>
                    </template>
                </div>

                <!-- Connect/Disconnect buttons (advanced mode) -->
                <div x-show="appMode === 'advanced'" style="padding:10px 12px; border-top:1px solid var(--border); display:flex; gap:8px;">
                    <button @click="api.connectServer(activeServer).catch(console.error)"
                            class="btn btn-primary btn-sm">Connect</button>
                    <button @click="api.disconnectServer(activeServer).catch(console.error)"
                            class="btn btn-danger btn-sm">Disconnect</button>
                </div>
            </div>
        </template>

    </main>
</div>
</body>
</html>
