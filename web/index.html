<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xirc</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="appStore">
<div class="app">

    <!-- Mobile hamburger -->
    <button class="hamburger-btn"
            @click="sidebarOpen = !sidebarOpen">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
    </button>
    <!-- Mobile overlay -->
    <div class="sidebar-overlay"
         x-show="sidebarOpen"
         @click="sidebarOpen = false"></div>

    <!-- Sidebar -->
    <aside class="sidebar" :class="sidebarOpen ? 'open' : ''">
        <div class="sidebar-header">xirc</div>

        <div class="server-tree" x-show="appMode === 'advanced'">
            <template x-for="server in servers" :key="server.id">
                <div>
                    <!-- Server row -->
                    <div
                        class="server-item"
                        :class="{ active: activeServer === server.id && activeView === 'channel' }"
                        @click="toggleServer(server.id); sidebarOpen = false"
                    >
                        <span
                            class="status-dot"
                            :class="serverStatus(server.id)"
                        ></span>
                        <span x-text="server.name"></span>
                    </div>

                    <!-- Channels under this server -->
                    <template x-if="isExpanded(server.id)">
                        <div>
                            <template x-for="ch in (server.channels || [])" :key="ch">
                                <div
                                    class="channel-item"
                                    :class="{ active: activeServer === server.id && activeChannel === ch && activeView === 'channel' }"
                                    @click="selectChannel(server.id, ch); sidebarOpen = false"
                                    x-text="ch"
                                ></div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- Bottom nav -->
        <nav class="sidebar-nav">
            <a
                :class="{ active: activeView === 'downloads' }"
                @click="setView('downloads'); sidebarOpen = false"
            >Downloads</a>
            <a
                x-show="appMode === 'advanced'"
                :class="{ active: activeView === 'settings' }"
                @click="setView('settings'); sidebarOpen = false"
            >Settings</a>
        </nav>

        <!-- Disk usage bar (placeholder) -->
        <div>
            <div class="disk-label">Disk</div>
            <div class="disk-bar">
                <div class="disk-bar-fill ok" style="width: 0%"></div>
            </div>
        </div>

        <!-- Mode toggle -->
        <div class="sidebar-mode-toggle">
            <span>Mode:</span>
            <div class="mode-btns">
                <button @click="setMode('simple')"
                        :class="appMode === 'simple' ? 'active' : ''">Simple</button>
                <button @click="setMode('advanced')"
                        :class="appMode === 'advanced' ? 'active' : ''">Advanced</button>
            </div>
        </div>
    </aside>

    <!-- Main content -->
    <main class="main">

        <!-- Channel view -->
        <template x-if="activeView === 'channel'">
            <div style="display:flex; flex-direction:column; height:100%; overflow:hidden;">
                <div class="content-header">
                    <span x-text="activeChannel || 'Select a channel'"></span>
                </div>

                <!-- Tab bar (only shown when a channel is selected) -->
                <template x-if="activeChannel">
                    <div class="tabs">
                        <div
                            class="tab"
                            :class="{ active: !showIrcConsole }"
                            @click="showIrcConsole = false"
                        >Search Results</div>
                        <div
                            class="tab"
                            :class="{ active: showIrcConsole }"
                            @click="showIrcConsole = true"
                        >IRC Console</div>
                    </div>
                </template>

                <!-- Search results panel -->
                <div
                    class="content-body"
                    style="overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:16px;"
                    x-show="!showIrcConsole"
                >
                    <!-- Search bar -->
                    <template x-if="activeChannel">
                        <div>
                            <div class="search-bar">
                                <input
                                    type="text"
                                    placeholder="Search for files..."
                                    x-model="searchQuery"
                                    @keydown.enter="runSearch()"
                                >
                                <button
                                    class="btn btn-primary"
                                    @click="runSearch()"
                                    :disabled="searchRunning"
                                    x-text="searchRunning ? 'Searching...' : 'Search'"
                                ></button>
                                <button
                                    class="btn btn-sm"
                                    @click="bookmarkSearch()"
                                    :disabled="!searchQuery.trim()"
                                    title="Save this search"
                                >Bookmark</button>
                                <select
                                    style="padding:6px 8px; background:var(--bg-input); border:1px solid var(--border); border-radius:4px; color:var(--text-primary); font-size:13px;"
                                    @change="applySavedSearch($event.target.value); $event.target.value = ''"
                                >
                                    <option value="">Saved searches…</option>
                                    <template x-for="ss in savedSearches" :key="ss.id">
                                        <option :value="ss.query" x-text="ss.query"></option>
                                    </template>
                                </select>
                            </div>

                            <!-- Search results table -->
                            <template x-if="searchResults.length > 0">
                                <table>
                                    <thead>
                                        <tr>
                                            <th @click="sortBy('pack_number')" x-text="'Pack #' + sortIndicator('pack_number')"></th>
                                            <th @click="sortBy('filename')" x-text="'Filename' + sortIndicator('filename')"></th>
                                            <th @click="sortBy('filesize')" x-text="'Size' + sortIndicator('filesize')"></th>
                                            <th @click="sortBy('bot_nick')" x-text="'Bot' + sortIndicator('bot_nick')"></th>
                                            <th @click="sortBy('downloads_count')" x-text="'Downloads' + sortIndicator('downloads_count')"></th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="(r, i) in sortedResults()" :key="i">
                                            <tr :class="{ unparsed: !r.parsed }">
                                                <td x-text="r.pack_number != null ? r.pack_number : '-'"></td>
                                                <td>
                                                    <span x-text="r.filename || r.raw_line || '-'"></span>
                                                    <template x-if="!r.parsed">
                                                        <a
                                                            href="#"
                                                            style="margin-left:8px; font-size:11px; color:var(--warning);"
                                                            @click.prevent="teachParser(r.raw_line)"
                                                        >teach parser</a>
                                                    </template>
                                                </td>
                                                <td x-text="r.filesize || '-'"></td>
                                                <td x-text="r.bot_nick || '-'"></td>
                                                <td x-text="r.downloads_count != null ? r.downloads_count : '-'"></td>
                                                <td>
                                                    <button
                                                        class="btn btn-primary btn-sm"
                                                        @click="downloadPack(r)"
                                                        :disabled="!r.parsed"
                                                    >Download</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>

                            <template x-if="searchResults.length === 0 && !searchRunning">
                                <p style="color: var(--text-muted); font-size:13px;">No results. Enter a query and press Search.</p>
                            </template>
                        </div>
                    </template>

                    <template x-if="!activeChannel">
                        <p style="color: var(--text-muted); font-size:13px;">Select a channel from the sidebar to begin.</p>
                    </template>
                </div>

                <!-- IRC console panel -->
                <div class="irc-console" x-show="showIrcConsole && activeChannel">
                    <div class="irc-messages" x-ref="ircLog">
                        <template x-for="(msg, i) in currentChannelMessages()" :key="i">
                            <div class="irc-message">
                                <span class="time" x-text="formatTime(msg.timestamp)"></span>
                                <span class="nick" x-text="msg.nick + ':'"></span>
                                <span x-text="msg.message"></span>
                            </div>
                        </template>
                    </div>
                    <div class="irc-input">
                        <input
                            type="text"
                            placeholder="Type a message or /command..."
                            x-model="ircInput"
                            @keydown.enter="sendIrc()"
                        >
                    </div>
                </div>
            </div>
        </template>

        <!-- Downloads view -->
        <template x-if="activeView === 'downloads'">
            <div style="display:flex; flex-direction:column; height:100%; overflow:hidden;">
                <div class="content-header">
                    <span>Downloads</span>
                    <button class="btn btn-sm" style="margin-left:auto" @click="loadDownloads()">Refresh</button>
                </div>
                <div class="content-body" style="display:flex; flex-direction:column; gap:0; overflow:hidden;">
                    <!-- Filter tabs -->
                    <div class="tabs">
                        <div class="tab" :class="{ active: downloadFilter === 'all' }" @click="downloadFilter = 'all'">All</div>
                        <div class="tab" :class="{ active: downloadFilter === 'queued' }" @click="downloadFilter = 'queued'">Queued</div>
                        <div class="tab" :class="{ active: downloadFilter === 'downloading' }" @click="downloadFilter = 'downloading'">Downloading</div>
                        <div class="tab" :class="{ active: downloadFilter === 'completed' }" @click="downloadFilter = 'completed'">Completed</div>
                        <div class="tab" :class="{ active: downloadFilter === 'failed' }" @click="downloadFilter = 'failed'">Failed</div>
                    </div>
                    <!-- Downloads table -->
                    <div style="overflow-y:auto; flex:1;">
                        <template x-if="filteredDownloads().length > 0">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Status</th>
                                        <th>Filename</th>
                                        <th>Bot</th>
                                        <th>Size</th>
                                        <th>Progress</th>
                                        <th>Speed</th>
                                        <th>ETA</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="dl in filteredDownloads()" :key="dl.id">
                                        <tr>
                                            <td>
                                                <span
                                                    class="badge"
                                                    :class="'badge-' + dl.status"
                                                    x-text="dl.status"
                                                ></span>
                                            </td>
                                            <td x-text="dl.filename || '-'"></td>
                                            <td>
                                                <span class="tooltip">
                                                    <span x-text="dl.bot_nick || '-'"></span>
                                                    <span class="tooltip-text" x-text="dl.filesize || '-'"></span>
                                                </span>
                                            </td>
                                            <td x-text="dl.filesize || '-'"></td>
                                            <td>
                                                <template x-if="dl.status === 'downloading'">
                                                    <div class="progress">
                                                        <div
                                                            class="progress-fill"
                                                            :style="'width:' + downloadProgress(dl) + '%'"
                                                        ></div>
                                                    </div>
                                                </template>
                                                <template x-if="dl.status !== 'downloading'">
                                                    <span x-text="dl.status === 'completed' ? '100%' : '-'"></span>
                                                </template>
                                            </td>
                                            <td x-text="dl.status === 'downloading' && dl.speed ? formatSpeed(dl.speed) : '-'"></td>
                                            <td x-text="dl.status==='downloading' ? formatETA(Math.max(0, dl.total_size - dl.bytes_received), dl.speed) : '-'"></td>
                                            <td style="white-space:nowrap;">
                                                <template x-if="dl.status === 'downloading' || dl.status === 'queued'">
                                                    <span>
                                                        <button class="btn btn-danger btn-sm" @click="cancelDownload(dl.id)">Cancel</button>
                                                        <template x-if="dl.status === 'queued'">
                                                            <button class="btn btn-sm" style="margin-left:4px" @click="moveToFront(dl.id)">Move to front</button>
                                                        </template>
                                                    </span>
                                                </template>
                                                <template x-if="dl.status === 'failed' || dl.status === 'needs_action'">
                                                    <button class="btn btn-primary btn-sm" @click="retryDownload(dl.id)">Retry</button>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template x-if="filteredDownloads().length === 0">
                            <p style="color: var(--text-muted); font-size:13px; padding:16px 0;">No downloads.</p>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- Settings view -->
        <template x-if="activeView === 'settings'">
            <div style="display:flex; flex-direction:column; height:100%; overflow:hidden;">
                <div class="content-header">
                    <span>Settings</span>
                </div>
                <div class="content-body" style="overflow-y:auto; flex:1;">

                    <!-- Settings tab bar -->
                    <div class="tabs">
                        <div class="tab" :class="{ active: settingsTab === 'servers' }" @click="settingsTab = 'servers'">Servers</div>
                        <div class="tab" :class="{ active: settingsTab === 'channels' }" @click="settingsTab = 'channels'">Channels</div>
                        <div class="tab" :class="{ active: settingsTab === 'routing' }" @click="settingsTab = 'routing'">File Routing</div>
                        <div class="tab" :class="{ active: settingsTab === 'hooks' }" @click="settingsTab = 'hooks'">Post-Hooks</div>
                        <div class="tab" :class="{ active: settingsTab === 'general' }" @click="settingsTab = 'general'">General</div>
                    </div>

                    <!-- Servers tab -->
                    <template x-if="settingsTab === 'servers'">
                        <div style="padding-top:16px;">
                            <button class="btn btn-primary btn-sm" @click="openServerForm(null)">Add Server</button>

                            <template x-if="settingsServers.length > 0">
                                <table style="margin-top:12px;">
                                    <thead>
                                        <tr>
                                            <th>Name</th>
                                            <th>Host</th>
                                            <th>Port</th>
                                            <th>Nick</th>
                                            <th>TLS</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="s in settingsServers" :key="s.id">
                                            <tr>
                                                <td x-text="s.name"></td>
                                                <td x-text="s.host"></td>
                                                <td x-text="s.port"></td>
                                                <td x-text="s.nickname"></td>
                                                <td x-text="s.ssl ? 'Yes' : 'No'"></td>
                                                <td style="white-space:nowrap;">
                                                    <button class="btn btn-sm" @click="openServerForm(s)">Edit</button>
                                                    <button class="btn btn-danger btn-sm" style="margin-left:4px;" @click="deleteServer(s.id)">Delete</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>
                            <template x-if="settingsServers.length === 0">
                                <p style="color:var(--text-muted); font-size:13px; margin-top:12px;">No servers configured.</p>
                            </template>

                            <!-- Server inline form -->
                            <template x-if="showServerForm">
                                <div style="margin-top:20px; padding:16px; border:1px solid var(--border); border-radius:6px;">
                                    <h3 style="margin:0 0 16px;" x-text="serverForm.id ? 'Edit Server' : 'Add Server'"></h3>
                                    <div class="form-group">
                                        <label>Name</label>
                                        <input type="text" x-model="serverForm.name" placeholder="e.g. IRCNet">
                                    </div>
                                    <div class="form-group">
                                        <label>Host</label>
                                        <input type="text" x-model="serverForm.host" placeholder="irc.example.net">
                                    </div>
                                    <div class="form-group">
                                        <label>Port</label>
                                        <input type="number" x-model.number="serverForm.port" min="1" max="65535">
                                    </div>
                                    <div class="form-group">
                                        <label>Nick</label>
                                        <input type="text" x-model="serverForm.nickname" placeholder="mynick">
                                    </div>
                                    <div class="form-group">
                                        <label>SSL</label>
                                        <label class="toggle">
                                            <input type="checkbox" x-model="serverForm.ssl">
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                    <div class="form-group">
                                        <label>Auto Connect</label>
                                        <label class="toggle">
                                            <input type="checkbox" x-model="serverForm.auto_connect">
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                    <div style="margin-top:12px; display:flex; gap:8px;">
                                        <button class="btn btn-primary btn-sm" @click="saveServer()">Save</button>
                                        <button class="btn btn-sm" @click="showServerForm = false">Cancel</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Channels tab -->
                    <template x-if="settingsTab === 'channels'">
                        <div style="padding-top:16px;">
                            <div class="form-group" style="max-width:320px;">
                                <label>Server</label>
                                <select @change="loadSettingsChannels(parseInt($event.target.value))" style="padding:6px 8px; background:var(--bg-input); border:1px solid var(--border); border-radius:4px; color:var(--text-primary); font-size:13px; width:100%;">
                                    <option value="">Select a server…</option>
                                    <template x-for="s in settingsServers" :key="s.id">
                                        <option :value="s.id" :selected="settingsServerId === s.id" x-text="s.name"></option>
                                    </template>
                                </select>
                            </div>

                            <button class="btn btn-primary btn-sm" :disabled="!settingsServerId" @click="openChannelForm(null)">Add Channel</button>

                            <template x-if="settingsServerId && settingsChannels.length > 0">
                                <table style="margin-top:12px;">
                                    <thead>
                                        <tr>
                                            <th>Name</th>
                                            <th>Search Command</th>
                                            <th>Download Channel</th>
                                            <th>Auto-join</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="ch in settingsChannels" :key="ch.id">
                                            <tr>
                                                <td x-text="ch.name"></td>
                                                <td x-text="ch.search_command || '-'"></td>
                                                <td x-text="ch.download_channel || '-'"></td>
                                                <td x-text="ch.auto_join ? 'Yes' : 'No'"></td>
                                                <td style="white-space:nowrap;">
                                                    <button class="btn btn-sm" @click="openChannelForm(ch)">Edit</button>
                                                    <button class="btn btn-danger btn-sm" style="margin-left:4px;" @click="deleteChannel(ch.id)">Delete</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>
                            <template x-if="settingsServerId && settingsChannels.length === 0">
                                <p style="color:var(--text-muted); font-size:13px; margin-top:12px;">No channels configured for this server.</p>
                            </template>

                            <!-- Channel inline form -->
                            <template x-if="showChannelForm">
                                <div style="margin-top:20px; padding:16px; border:1px solid var(--border); border-radius:6px;">
                                    <h3 style="margin:0 0 16px;" x-text="channelForm.id ? 'Edit Channel' : 'Add Channel'"></h3>
                                    <div class="form-group">
                                        <label>Name</label>
                                        <input type="text" x-model="channelForm.name" placeholder="#channel">
                                    </div>
                                    <div class="form-group">
                                        <label>Search Command</label>
                                        <input type="text" x-model="channelForm.search_command" placeholder="!search">
                                    </div>
                                    <div class="form-group">
                                        <label>Download Channel</label>
                                        <input type="text" x-model="channelForm.download_channel" placeholder="#download-channel">
                                    </div>
                                    <div class="form-group">
                                        <label>Auto-join</label>
                                        <label class="toggle">
                                            <input type="checkbox" x-model="channelForm.auto_join">
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                    <div style="margin-top:12px; display:flex; gap:8px;">
                                        <button class="btn btn-primary btn-sm" @click="saveChannel()">Save</button>
                                        <button class="btn btn-sm" @click="showChannelForm = false">Cancel</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- File Routing tab -->
                    <template x-if="settingsTab === 'routing'">
                        <div style="padding-top:16px;">
                            <button class="btn btn-primary btn-sm" @click="openRoutingForm(null)">Add Rule</button>

                            <template x-if="routingRules.length > 0">
                                <table style="margin-top:12px;">
                                    <thead>
                                        <tr>
                                            <th>Pattern</th>
                                            <th>Destination</th>
                                            <th>Priority</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="r in routingRules" :key="r.id">
                                            <tr>
                                                <td x-text="r.pattern"></td>
                                                <td x-text="r.destination_dir"></td>
                                                <td x-text="r.priority"></td>
                                                <td style="white-space:nowrap;">
                                                    <button class="btn btn-sm" @click="openRoutingForm(r)">Edit</button>
                                                    <button class="btn btn-danger btn-sm" style="margin-left:4px;" @click="deleteRoutingRule(r.id)">Delete</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>
                            <template x-if="routingRules.length === 0">
                                <p style="color:var(--text-muted); font-size:13px; margin-top:12px;">No routing rules configured.</p>
                            </template>

                            <!-- Routing inline form -->
                            <template x-if="showRoutingForm">
                                <div style="margin-top:20px; padding:16px; border:1px solid var(--border); border-radius:6px;">
                                    <h3 style="margin:0 0 16px;" x-text="routingForm.id ? 'Edit Rule' : 'Add Rule'"></h3>
                                    <div class="form-group">
                                        <label>Pattern</label>
                                        <input type="text" x-model="routingForm.pattern" placeholder="*.mkv">
                                    </div>
                                    <div class="form-group">
                                        <label>Destination Dir</label>
                                        <input type="text" x-model="routingForm.destination_dir" placeholder="/mnt/media/video">
                                    </div>
                                    <div class="form-group">
                                        <label>Priority</label>
                                        <input type="number" x-model.number="routingForm.priority">
                                    </div>
                                    <div style="margin-top:12px; display:flex; gap:8px;">
                                        <button class="btn btn-primary btn-sm" @click="saveRoutingRule()">Save</button>
                                        <button class="btn btn-sm" @click="showRoutingForm = false">Cancel</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Post-Hooks tab -->
                    <template x-if="settingsTab === 'hooks'">
                        <div style="padding-top:16px;">
                            <button class="btn btn-primary btn-sm" @click="openHookForm(null)">Add Hook</button>

                            <template x-if="hooks.length > 0">
                                <table style="margin-top:12px;">
                                    <thead>
                                        <tr>
                                            <th>Name</th>
                                            <th>Type</th>
                                            <th>Config</th>
                                            <th>Enabled</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="h in hooks" :key="h.id">
                                            <tr>
                                                <td x-text="h.name"></td>
                                                <td x-text="h.hook_type"></td>
                                                <td x-text="h.config"></td>
                                                <td x-text="h.enabled ? 'Yes' : 'No'"></td>
                                                <td style="white-space:nowrap;">
                                                    <button class="btn btn-sm" @click="openHookForm(h)">Edit</button>
                                                    <button class="btn btn-danger btn-sm" style="margin-left:4px;" @click="deleteHook(h.id)">Delete</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>
                            <template x-if="hooks.length === 0">
                                <p style="color:var(--text-muted); font-size:13px; margin-top:12px;">No hooks configured.</p>
                            </template>

                            <!-- Hook inline form -->
                            <template x-if="showHookForm">
                                <div style="margin-top:20px; padding:16px; border:1px solid var(--border); border-radius:6px;">
                                    <h3 style="margin:0 0 16px;" x-text="hookForm.id ? 'Edit Hook' : 'Add Hook'"></h3>
                                    <div class="form-group">
                                        <label>Name</label>
                                        <input type="text" x-model="hookForm.name" placeholder="My Hook">
                                    </div>
                                    <div class="form-group">
                                        <label>Type</label>
                                        <select x-model="hookForm.hook_type" style="padding:6px 8px; background:var(--bg-input); border:1px solid var(--border); border-radius:4px; color:var(--text-primary); font-size:13px;">
                                            <option value="script">Script</option>
                                            <option value="rename">Rename</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Config</label>
                                        <input type="text" x-model="hookForm.config" placeholder="JSON config or rename pattern">
                                    </div>
                                    <div class="form-group">
                                        <label>Enabled</label>
                                        <label class="toggle">
                                            <input type="checkbox" x-model="hookForm.enabled">
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                    <div style="margin-top:12px; display:flex; gap:8px;">
                                        <button class="btn btn-primary btn-sm" @click="saveHook()">Save</button>
                                        <button class="btn btn-sm" @click="showHookForm = false">Cancel</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- General tab -->
                    <template x-if="settingsTab === 'general'">
                        <div style="padding-top:16px;">
                            <p style="color:var(--text-muted); font-size:13px;">General settings coming soon.</p>
                        </div>
                    </template>

                </div>
            </div>
        </template>

    </main>
</div>
</body>
</html>
